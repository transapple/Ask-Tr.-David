<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Tr. David, your assistant</title>
<style>
:root{--bg:#fff;--text:#111b21;--sub:#667781;--out:color-mix(in srgb,var(--green) 18%,#fff);--in:#fff;--wall:#efeae2;--green:#00a884;--bar:#fff;--tick:#34b7f1;--line:#e4e6e8;--sheet:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--text:#e9edef;--sub:#8696a0;--out:color-mix(in srgb,var(--green) 45%,#0b141a);--in:#202c33;--wall:#0b141a;--bar:#202c33;--line:#2a3942;--sheet:#233138}}
:root[data-theme="dark"]{--bg:#0b141a;--text:#e9edef;--sub:#8696a0;--out:color-mix(in srgb,var(--green) 45%,#0b141a);--in:#202c33;--wall:#0b141a;--bar:#202c33;--line:#2a3942;--sheet:#233138}
:root[data-theme="light"]{--bg:#fff;--text:#111b21;--sub:#667781;--out:color-mix(in srgb,var(--green) 18%,#fff);--in:#fff;--wall:#efeae2;--bar:#fff;--line:#e4e6e8;--sheet:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}
body{background:var(--bg);color:var(--text);font:1rem/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:800px;margin:0 auto;background:var(--wall);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px 8px;background:var(--bar);border-bottom:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:600}
#nm{font-weight:600;font-size:17px}.t{font-size:12px;color:var(--sub)}
.ic{background:none;border:0;color:var(--sub);cursor:pointer;padding:6px;display:grid;place-items:center}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#msgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.b{max-width:78%;padding:7px 10px 5px;border-radius:14px;word-wrap:break-word;white-space:pre-wrap;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.b.o{align-self:flex-end;background:var(--out);border-bottom-right-radius:4px}
.b.i{align-self:flex-start;background:var(--in);border-bottom-left-radius:4px}
.b small{float:right;margin:7px 0 0 10px;font-size:11px;color:var(--sub);display:inline-flex;align-items:center;gap:3px}
.b small svg{width:16px;height:16px;stroke-width:2.4}.rd{color:var(--tick)}
.day{align-self:center;background:var(--in);color:var(--sub);font-size:12px;padding:4px 12px;border-radius:10px;margin:8px 0}
#editing{display:none;background:var(--bar);padding:8px 16px;font-size:13px;color:var(--green);border-top:1px solid var(--line)}
#cmp{display:flex;gap:4px;align-items:center;padding:6px 8px;background:var(--bar)}
#cmp .ic{padding:4px;flex-shrink:0}#cmp .ic svg{width:22px;height:22px}
#inp{flex:1;min-width:0;width:100%;border:0;border-radius:20px;padding:9px 12px;font-size:15px;background:var(--wall);color:var(--text);font:inherit;outline:0}
#send{width:38px;height:38px;flex-shrink:0;border:0;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;cursor:pointer}
#send svg{stroke-width:2.2}
#srch{display:none;gap:8px;align-items:center;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
#sq{flex:1;border:0;border-radius:20px;padding:9px 14px;background:var(--wall);color:var(--text);font:inherit;outline:0}
#cnt{font-size:12px;color:var(--sub);white-space:nowrap}mark{background:#ffd54a;color:#111;border-radius:3px}
#more{position:fixed;display:none;top:calc(52px + env(safe-area-inset-top,0px));right:10px;background:var(--sheet);color:var(--text);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.3);min-width:200px;overflow:hidden;z-index:8}
#more div{padding:14px 18px;cursor:pointer}#more div:active{background:var(--wall)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet{width:100%;max-width:500px;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
#sheet div{background:var(--sheet);text-align:center;padding:16px;font-size:17px;cursor:pointer;border-top:1px solid var(--line);color:#0a84ff}
#sheet div:first-child{border-radius:14px 14px 0 0;border-top:0}#sheet div:nth-last-child(2){border-radius:0 0 14px 14px}
#sheet .x{border-radius:14px;margin-top:8px;font-weight:600;border:0}#sheet .dl{color:#ff453a}
#panel{position:fixed;inset:0;margin:0 auto;max-width:800px;background:var(--bg);display:none;flex-direction:column;z-index:7}
#pbody{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.row:active{background:var(--wall)}.row small{display:block;color:var(--sub);font-size:13px}.row.danger{color:#ff453a}
.row input{width:22px;height:22px;accent-color:var(--green);pointer-events:none;flex-shrink:0}
.ri{width:28px;height:28px;color:var(--text);display:grid;place-items:center;flex-shrink:0}.ri svg{width:24px;height:24px;stroke-width:1.8}
#subs{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
#subs button,.chips button,.st,.lk{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:16px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
#subs .on,.lk.on,.act .on,#mic.on{background:var(--green);color:#fff;border-color:var(--green)}#mic.on{border-radius:50%}
.b.ai{max-width:100%}.md h3{font-size:1.1em;margin:2px 0 4px}.md h4{margin:8px 0 2px;color:var(--green)}.md p{margin:3px 0}.md ul,.md ol{margin:3px 0 3px 20px}
.md table{border-collapse:collapse;margin:6px 0;width:100%}.md td{border:1px solid var(--line);padding:4px 8px;font-size:.9em}.md tr:first-child td{font-weight:600}.md code{background:var(--wall);padding:1px 5px;border-radius:4px}
.act,.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.act button{border:0;background:none;color:var(--sub);font:inherit;font-size:12px;cursor:pointer;padding:3px 8px;border-radius:10px}.act{clear:both}.act button{padding:14px 14px 8px;display:grid;place-items:center}.act button svg{width:23px;height:23px}.act.out{align-self:flex-start;margin:-6px 0 8px 0;gap:4px}.act .on{background:none;border:0;color:var(--green)}.act .on svg{fill:currentColor}.act button:active{background:var(--wall)}
.opt{display:block;width:100%;text-align:left;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;cursor:pointer}.opt.ok{border-color:#2f9e44;background:#2f9e4430}.opt.bad{border-color:#ff453a;background:#ff453a30}
.err{border:1px solid #ff453a}.note{text-align:center;font-size:11px;color:var(--sub);padding:3px 8px 6px;background:var(--bar)}
.fld{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.b img{display:block;max-width:100%;border-radius:8px;margin-bottom:4px}.st{display:block;margin:8px auto;white-space:normal}.lk.dg{color:#ff453a}
:root[data-hc]{--sub:var(--text);--line:var(--text)}
#hl .row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lvl{margin:0 14px;border-bottom:1px solid var(--line)}
.lvh{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:12px 4px;color:var(--text);cursor:pointer}
.lvh svg{width:20px;height:20px;transition:transform .2s}.lvh.open svg{transform:rotate(180deg)}
.lvt{color:var(--text);font-size:1.2em;font-weight:700;font-family:inherit}
.lvc{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 12px}
.lvc button{border:1px solid var(--text);background:none;color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:.85em;cursor:pointer}
.lvc .on{background:var(--text);color:var(--bg)}
.empty{padding:50px 20px;text-align:center;color:var(--sub)}
#clrsel{position:sticky;bottom:0;display:block;width:calc(100% - 28px);margin:14px;padding:14px;border:0;border-radius:12px;background:#ff453a;color:#fff;font:600 16px inherit;cursor:pointer}
#clrsel:disabled{opacity:.4;cursor:default}
.sws{display:flex;gap:16px;flex-wrap:wrap;padding:20px 18px}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 3px var(--bg);cursor:pointer}.sw.on{border-color:var(--text)}
.sec{padding:16px 18px 0;color:var(--sub);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
#bdg{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#ff453a;border:2px solid var(--bar);box-sizing:border-box;display:none}
#ann{display:none;align-items:center;gap:10px;padding:10px 12px 10px 14px;background:var(--sheet,#fff);color:var(--text);border-bottom:1px solid var(--line);border-left:4px solid var(--green)}
#ann b{display:block;font-size:14px}#annb{font-size:13px;color:var(--sub);margin-top:2px;white-space:pre-wrap;word-wrap:break-word}
#annx{border:0;background:none;color:var(--green);font:600 14px inherit;padding:8px 6px;cursor:pointer}
#jump{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;border:0;background:var(--sheet,#fff);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;place-items:center;z-index:5;cursor:pointer}
</style></head><body>
<div id="app">
<header><div id="hd" style="display:flex;align-items:center;gap:10px;flex:1"><div id="avw" role="button" aria-label="What's new" style="position:relative;cursor:pointer"><div class="av" id="av">A</div><span id="bdg"></span></div><div><div id="nm">Alex</div><div class="t" id="stat">online</div></div></div><button class="ic" id="dots" aria-label="Menu"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></header>
<div id="ann"><div style="flex:1;min-width:0"><b id="annt"></b><div id="annb"></div></div><button id="annx">Hide</button></div>
<div id="srch"><input id="sq" placeholder="Search chat history" autocomplete="off"><span id="cnt"></span><button class="ic" id="sx" aria-label="Close search"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div id="subs"></div>
<div id="msgs"></div>
<button id="jump" aria-label="Scroll to latest"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
<div id="editing">Editing message. Tap here to cancel.</div>
<div id="cmp"><input id="file" type="file" accept="image/*" hidden><button class="ic" id="ph" aria-label="Photo question"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/></svg></button><button class="ic" id="mic" aria-label="Voice question"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button><input id="inp" placeholder="Ask a question" autocomplete="off"><button id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button></div>
<div class="note">Answers can be wrong. Check important work with your teacher.</div>
</div>
<div id="dlgx" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);place-items:center;z-index:120;padding:20px"><div style="background:var(--sheet,#fff);color:var(--text,#111);border-radius:14px;padding:20px;width:100%;max-width:320px;box-shadow:0 4px 18px rgba(0,0,0,.3)"><div id="dlgm" style="font-size:16px;line-height:1.4;margin-bottom:14px;white-space:pre-wrap"></div><input id="dlgi" autocomplete="off" style="display:none;width:100%;box-sizing:border-box;margin-bottom:14px;padding:10px;font-size:16px;border:1px solid var(--line,#ccc);border-radius:8px;background:var(--wall,#fff);color:inherit"><div style="display:flex;justify-content:flex-end;gap:8px"><button id="dlgc" style="background:none;border:0;padding:8px 14px;font-size:15px;color:inherit;cursor:pointer">Cancel</button><button id="dlgo" style="background:var(--green,#00a884);color:#fff;border:0;border-radius:8px;padding:8px 18px;font-size:15px;cursor:pointer">OK</button></div></div></div>
<div id="more"><div data-a="n">New chat</div><div data-a="h">Chat history</div><div data-a="b">Saved answers</div><div data-a="s">Search chat</div><div data-a="cc" style="color:#e03131">Clear chat</div><div data-a="g">Settings</div></div>
<div id="panel"></div>
<div id="scrim"><div id="sheet"></div></div>

  if(last)h+=(m.w&&m.w.shown<m.w.parts.length)?wBtns(m,i):`<div class="chips">${["Explain simpler","Give an example","More detail","Quiz me"].map(c=>`<button data-chip="${c}">${c}</button>`).join("")}</div>`}

 if(stream!=null)return;const ch=D.chats.find(c=>c.id==D.cur);if(ch.title=="New chat"||ch.title=="Chat")ch.title=q.slice(0,32);

  [
   "2026-10-29",
   "Added real step-by-step working for equations (tested on 18 cases, including brackets, x on both sides, fractions and no-solution). Answers are shown in stages with Next step, Break this step down and Show all steps. Found an existing issue: saved chats are not restored on reopen."
  ]
 ]
};
function hoCount(){let d=0,t=0;HANDOFF.tasks.forEach(g=>g[1].forEach(i=>{t++;if(i[1])d++}));return[d,t]}
function hoText(){const[d,t]=hoCount();let o="ASK TR. DAVID, YOUR ASSISTANT: PROJECT HANDOFF (updated "+HANDOFF.updated+")\n"+d+" of "+t+" items done\n\n";
 HANDOFF.about.forEach(a=>o+=a[0].toUpperCase()+"\n"+a[1]+"\n\n");
 HANDOFF.tasks.forEach(g=>{o+=g[0].toUpperCase()+"\n"+g[1].map(i=>(i[1]?"[done] ":"[remaining] ")+i[0]).join("\n")+"\n\n"});
 o+="LOG\n"+HANDOFF.log.map(l=>l[0]+": "+l[1]).join("\n");return o}
function handoff(){
 const[d,t]=hoCount(),pct=Math.round(d/t*100);
 const body=`<div style="padding:12px 18px"><b>${d} of ${t} done</b> <span style="color:var(--sub)">(${pct}%)</span><div style="height:8px;border-radius:4px;background:var(--wall);margin:8px 0"><div style="height:8px;border-radius:4px;background:var(--green);width:${pct}%"></div></div><small style="color:var(--sub)">Updated ${esc(HANDOFF.updated)}</small></div>
 <div class="row" data-a="cp"><div>Copy full handoff as text<small>Paste it to another Claude to continue</small></div></div>`+
 HANDOFF.tasks.map(g=>`<div class="sec">${esc(g[0])} (${g[1].filter(i=>i[1]).length}/${g[1].length})</div>`+g[1].map(i=>`<div class="row" style="display:block"><span style="color:${i[1]?"var(--green)":"var(--sub)"};font-weight:700">${i[1]?"&#10003;":"&#9675;"}</span> <span style="${i[1]?"":"font-weight:600"}">${esc(i[0])}</span></div>`).join("")).join("")+
 '<div class="sec">About</div>'+HANDOFF.about.map(a=>`<div style="padding:8px 18px"><b>${esc(a[0])}</b><div style="margin-top:3px;color:var(--sub);white-space:pre-wrap">${esc(a[1])}</div></div>`).join("")+
 '<div class="sec">Log</div>'+HANDOFF.log.map(l=>`<div style="padding:8px 18px"><small style="color:var(--sub)">${esc(l[0])}</small><div>${esc(l[1])}</div></div>`).join("");
 showP("Project handoff",body,settings,e=>{if(e.target.closest("[data-a=cp]")){const x=hoText();
  const fb=()=>{const ta=document.createElement("textarea");ta.value=x;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(_){}ta.remove();uiAlert("Handoff copied.")};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x).then(()=>uiAlert("Handoff copied."),fb);else fb()}})}
/* device back button: closes the top-most open layer; at the root, 3 quick presses exit */
(function(){
 const open=id=>getComputedStyle($(id)).display!="none";
 const any=()=>["dlgx","scrim","more","panel","srch","editing"].some(open);
 let pushed=false,skip=0,last=0,stage=0,toastEl=null,dlg=null,tt=0;
 const push=()=>{try{history.pushState({chat:1},"")}catch(e){}};
 push(); /* guard entry so back at the root can be intercepted */
 function sync(){
  if(any()&&!pushed){push();pushed=true}
  else if(!any()&&pushed){pushed=false;skip++;try{history.back()}catch(e){}}
 }
 function hideAll(){stage=0;clearTimeout(tt);if(toastEl){toastEl.remove();toastEl=null}if(dlg){dlg.remove();dlg=null}}
 function toast(t){
  hideAll();stage=1;
  toastEl=document.createElement("div");toastEl.textContent=t;
  toastEl.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:99;pointer-events:none";
  document.body.appendChild(toastEl);
  tt=setTimeout(()=>{if(toastEl){toastEl.remove();toastEl=null}},2000);
 }
 function exitApp(){
  removeEventListener("popstate",onPop);hideAll();
  try{window.close()}catch(e){}
  try{history.back()}catch(e){}
  setTimeout(()=>{location.replace("about:blank")},400);
 }
 function showDlg(){
  hideAll();stage=2;
  dlg=document.createElement("div");
  dlg.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:99";
  dlg.innerHTML='<div id="xbox" style="background:var(--sheet,#fff);color:var(--text,#111);border-radius:14px;padding:20px;min-width:240px;box-shadow:0 4px 18px rgba(0,0,0,.3)"><div style="font-weight:600;font-size:17px;margin-bottom:6px">Exit the app?</div><div style="font-size:13px;opacity:.7;margin-bottom:16px">Press back again to exit, or tap anywhere to cancel.</div><div style="display:flex;justify-content:flex-end;gap:8px"><button id="xno" style="background:none;border:0;padding:8px 14px;font-size:15px;color:inherit;cursor:pointer">Cancel</button><button id="xok" style="background:var(--green,#00a884);color:#fff;border:0;border-radius:8px;padding:8px 18px;font-size:15px;cursor:pointer">OK</button></div></div>';
  document.body.appendChild(dlg);
  dlg.onclick=e=>{if(e.target.id=="xok")exitApp();else hideAll()};
 }
 function rootBack(){
  const now=Date.now();
  if(now-last>2000){hideAll()}
  last=now;
  if(stage>=2){exitApp();return}
  push();
  if(stage==0)toast("Press back again to exit");
  else showDlg();
 }
 function onPop(){
  if(skip){skip--;return}
  if(any()){
   pushed=false;
   if(open("dlgx")){dlgCancel&&dlgCancel();if(open("dlgx"))$("dlgx").style.display="none"}
   else if(open("scrim"))$("scrim").style.display="none";
   else if(open("more"))$("more").style.display="none";
   else if(open("panel")){const b=$("pb");b&&b.onclick?b.onclick():closeP()}
   else if(open("srch"))closeSearch();
   else if(open("editing"))stopEdit();
   sync();
  }else rootBack();
 }
 addEventListener("popstate",onPop);
 /* tapping anywhere cancels the exit prompt */
 document.addEventListener("pointerdown",e=>{if(stage>0&&!(dlg&&e.target.id=="xok"))hideAll()},true);
 const mo=new MutationObserver(sync);
 ["dlgx","scrim","more","panel","srch","editing"].forEach(id=>mo.observe($(id),{attributes:true,attributeFilter:["style"]}));
})();
</script></body></html>
