<script>
/* Install page: decided before first paint so there is no flash.
   Shown only in a normal browser tab; never inside the installed app. */
(function () {
  try {
    var m = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
    var standalone = m("(display-mode: standalone)") || m("(display-mode: fullscreen)") || m("(display-mode: minimal-ui)") || window.navigator.standalone === true;
    var skip = false;
    try { skip = sessionStorage.getItem("ask_pgContinue") === "1"; } catch (e) {}
    if (!standalone && !skip) document.documentElement.classList.add("pg-on");
  } catch (e) {}
})();
</script>

.stp{display:flex;gap:12px;margin:12px 18px;align-items:flex-start}.stp i{flex:none;width:28px;height:28px;border-radius:4px;background:var(--green);color:#fff;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}.stp div{padding-top:3px;line-height:1.45}
.sh{cursor:pointer;color:var(--green);font-weight:600}.pw{position:relative}.pw .fld{padding-right:46px}.eye{position:absolute;right:4px;top:0;bottom:0;width:42px;border:0;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.eye svg{width:22px;height:22px;pointer-events:none}.rm{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:14px;color:var(--text);cursor:pointer}.rm input{width:18px;height:18px;accent-color:var(--green);margin:0}.bk{display:block;width:fit-content;margin:12px auto;padding:8px 16px;text-align:center;border-radius:24px;background:rgba(0,168,132,.12);background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green);font-weight:600;font-size:14px;cursor:pointer}.ar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;padding:0 18px}.ar .al{padding:9px 0}.al{padding:9px 18px;color:var(--green);cursor:pointer;font-size:14px}

/* input box differs from the chat body; blue send button; listening wave */
#iw{background:#e8eef7;border:1px solid #cdd8ea}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #iw{background:#2a3942;border-color:#3b4a54}}
:root[data-theme="dark"] #iw{background:#2a3942;border-color:#3b4a54}
:root[data-theme="light"] #iw{background:#e8eef7;border-color:#cdd8ea}
#send{background:#1a73e8;color:#fff}#send:active{background:#1560c7}
#wave{display:none;align-items:center;justify-content:center;gap:3px;height:30px;padding:0 6px;flex:1;min-width:0;overflow:hidden}
#iw.rec #inp{display:none}
#live{display:none;background:var(--bar);color:var(--text);padding:10px 18px 4px;font-size:16px;line-height:1.4;max-height:110px;overflow-y:auto;white-space:pre-wrap;word-wrap:break-word;-webkit-user-select:text;user-select:text}
#live.on{display:block}#live.empty{color:var(--sub)}
#iw.rec #wave{display:flex}
#wave i{display:block;width:3px;height:26px;border-radius:2px;background:#1a73e8;transform:scaleY(.15);transform-origin:center;will-change:transform}
#mic.on{background:#1a73e8;border-color:#1a73e8;color:#fff;animation:micp 1.6s ease-out infinite}
@keyframes micp{0%{box-shadow:0 0 0 0 rgba(26,115,232,.5)}100%{box-shadow:0 0 0 12px rgba(26,115,232,0)}}
@media(prefers-reduced-motion:reduce){#mic.on{animation:none}}

<script>
// ---------- PWA: install page + install button + service worker ----------
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("pgInstall");
  var label = btn.querySelector("span");
  var cont = document.getElementById("pgContinue");
  var msg = document.getElementById("pgMsg");
  var logo = document.querySelector("#pgGate .pg-logo");
  var fab = document.getElementById("pwaInstallBtn"); // small floating button, used after "Continue in browser"
  var ua = navigator.userAgent || "";
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var deferred = null, waiters = [], busy = false, installedNow = false;

  function isStandalone() {
    var m = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
    return m("(display-mode: standalone)") || m("(display-mode: fullscreen)") || m("(display-mode: minimal-ui)") || window.navigator.standalone === true;
  }
  function getFlag() { try { return localStorage.getItem("ask_pgInstalled") === "1"; } catch (e) { return false; } }
  function setFlag(on) { try { on ? localStorage.setItem("ask_pgInstalled", "1") : localStorage.removeItem("ask_pgInstalled"); } catch (e) {} }
  function gateVisible() { return root.classList.contains("pg-on"); }

  function toast(text) {
    var t = document.getElementById("pwaToast");
    if (!t) {
      t = document.createElement("div");
      t.id = "pwaToast";
      t.style.cssText = "position:fixed;left:50%;bottom:84px;transform:translateX(-50%);max-width:88vw;background:#161A26;color:#fff;padding:12px 16px;border-radius:12px;font:600 13.5px/1.4 system-ui,sans-serif;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center;";
      document.body.appendChild(t);
    }
    t.textContent = text;
    t.style.display = "block";
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.style.display = "none"; }, 8000);
  }
  function notify(text) {
    if (gateVisible()) { msg.textContent = text; msg.hidden = false; } else { toast(text); }
  }
  function setBusy(on, text) { busy = on; btn.disabled = on; label.textContent = text || "Install"; }
  function syncFab() {
    if (!fab) return;
    fab.style.display = (!isStandalone() && !installedNow && (deferred || isIOS)) ? "flex" : "none";
  }
  function waitForPrompt(ms) {
    return new Promise(function (resolve) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; resolve(null); } }, ms);
      waiters.push(function (e) { if (!done) { done = true; clearTimeout(t); resolve(e); } });
    });
  }

  async function doInstall() {
    if (busy) return;
    var p = deferred;
    if (!p) {
      if (isIOS) { notify("To install: tap the Share icon, then \u201CAdd to Home Screen\u201D."); return; }
      if (installedNow || getFlag()) { notify("Ask Tr. David is already installed on this device. Open it from your home screen or app list."); return; }
      // The browser can take a second or two after the first visit before it allows the install.
      setBusy(true, "Preparing\u2026");
      p = await waitForPrompt(3500);
      setBusy(false);
      if (!p) { notify("To install, open your browser menu (\u22EE) and tap \u201CInstall app\u201D or \u201CAdd to Home screen\u201D."); return; }
    }
    deferred = null; // a prompt can only be used once
    try {
      p.prompt();
      var choice = await p.userChoice;
      if (choice && choice.outcome === "accepted") {
        setBusy(true, "Installing\u2026");
        notify("Installing\u2026 Ask Tr. David will appear on your home screen in a few moments.");
        setTimeout(function () { if (busy && !installedNow) setBusy(false); }, 90000); // safety: never leave the button stuck
      } else {
        notify("Install cancelled. You can install any time from your browser menu (\u22EE) \u2192 \u201CInstall app\u201D.");
      }
    } catch (err) {
      notify("Couldn\u2019t start the install. Open your browser menu (\u22EE) and tap \u201CInstall app\u201D or \u201CAdd to Home screen\u201D.");
    }
    syncFab();
  }

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    setFlag(false); // the browser only offers this when the app is NOT installed
    waiters.splice(0).forEach(function (fn) { fn(e); });
    syncFab();
  });
  window.addEventListener("appinstalled", function () {
    installedNow = true;
    deferred = null;
    setFlag(true);
    setBusy(true, "Installed \u2713");
    notify("Ask Tr. David is installed. Open it from your home screen or app list.");
    syncFab();
  });

  btn.addEventListener("click", doInstall);
  if (fab) fab.addEventListener("click", doInstall);
  cont.addEventListener("click", function (e) {
    e.preventDefault();
    try { sessionStorage.setItem("ask_pgContinue", "1"); } catch (err) {}
    root.classList.remove("pg-on");
    syncFab();
  });

  // If the bundled icon file is missing, fall back to the logo embedded in this page.
  logo.addEventListener("error", function () {
    var l = document.querySelector('link[rel="apple-touch-icon"]');
    if (l && logo.src !== l.href) logo.src = l.href;
  });

  if (isStandalone()) setFlag(true); // remember that the app exists on this device
  syncFab();

  if ("serviceWorker" in navigator) {
    // A real same-origin file (blob: URLs are rejected for service workers). Upload sw.js next to this file.
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function (err) { console.warn("SW registration failed:", err); });
    });
  }
})();
</script>

`The **LCM** (lowest common multiple) of two numbers is the smallest number that both of them divide into exactly. The **HCF** (highest common factor) is the biggest number that divides both exactly.`,
`- **LCM by listing:** write multiples of each number until you meet the first one they share.\n- **HCF by listing:** write all factors of each number and pick the biggest one they share.\n- **Using prime factors:** LCM takes every prime factor at its highest power; HCF takes only the common prime factors at their lowest power.`,
`- LCM: when two events repeat and meet again (two bells ringing).\n- HCF: cutting things into the biggest equal pieces; simplifying fractions.`,
`LCM is the first time two counting lists meet. HCF is the biggest number that fits into both.`,
`- Multiples of 4: 4, 8, **12**; multiples of 6: 6, **12**. So LCM of 4 and 6 = 12.\n- Factors of 12: 1, 2, 3, 4, **6**, 12; factors of 18: 1, 2, 3, **6**, 9, 18. So HCF = 6.`,
`## Prime factor method (12 and 18)\n- 12 = 2 × 2 × 3 and 18 = 2 × 3 × 3.\n- HCF = 2 × 3 = 6. LCM = 2 × 2 × 3 × 3 = 36.\n## Common mistakes\n- Mixing up LCM and HCF. LCM is never smaller than the numbers; HCF is never bigger.`,

/* MODEL STYLE: the stored answer is one text for everyone. The ai_style function rewrites it in the chosen model's own writing style
 (how it summarises, analyses and describes). This has nothing to do with the microphone.
 FLOW: a learner asks -> if a rewrite is saved it is used; if not, Gemini writes it right then, it is saved and the learner gets it at once.
 No approval wait and NO label for learners. The owner (DAVID) sees every saved rewrite and every new Gemini-answered question, with what the
 learner asked, in Settings > Learner answers, and approves, edits or rejects them. Approved = kept for good. If the function is missing, busy

const STU=SBU.replace("/rest/v1/","/functions/v1/")+"ai_style",hsh=t=>{let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return h.toString(36)};
const svNo={};
async function styleAnswer(t,q){
 const k=modelName(),pl=planName(),L=lvKey(),ck="ask_sty3_"+k+"_"+pl+"_"+L+"_"+hsh(t)+"_"+t.length;
 /* approved copies are kept on the phone for 12 hours */
 try{const c=JSON.parse(localStorage.getItem(ck)||"null");if(c&&c.md&&Date.now()-c.at<432e5)return{md:c.md,st:"approved"}}catch(e){}
 if(svNo[ck]&&Date.now()-svNo[ck]<6e5)return null;
 const ct=new AbortController(),tm=setTimeout(()=>ct.abort(),9000);
 try{const r=await fetch(STU,{method:"POST",signal:ct.signal,headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify({text:t,model:k,level:L,plan:pl,depth:modelDepth(k),q:String(q||"").slice(0,200)})});
  if(!r.ok)return null;const j=await r.json();
  if(j.status=="ok"&&j.md){const st=j.state=="draft"?"draft":"approved";if(st=="approved"){try{localStorage.setItem(ck,JSON.stringify({md:j.md,at:Date.now()}))}catch(e){}}return{md:j.md,st}}
  if(j.status=="no_answer"&&j.reason=="rejected")svNo[ck]=Date.now();
 }catch(e){}finally{clearTimeout(tm)}
 return null}
